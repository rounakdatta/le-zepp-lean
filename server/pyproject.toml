[project]
name = "lezepplean-server"
version = "0.1.0"
description = "Identifies songs from watch mic clips and returns time-synced lyrics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "shazamio>=0.7",
    "av>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=2",
    # shazamio -> pydub imports `audioop`, which Python 3.13 removed from the stdlib
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[dependency-groups]
dev = ["pytest>=8"]
# Word alignment worker (`python -m lezepplean.align`). Opt-in: `uv sync --group align`.
# Apple Silicon only: vocal separation and the CTC aligner both run on MLX.
align = [
    "mlx>=0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "demucs-mlx>=1.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "yt-dlp[default]>=2026.8.19",
    "uroman>=1.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
