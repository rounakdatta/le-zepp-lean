[project]
name = "lezepplean-server"
version = "0.2.0"
description = "Identifies songs from watch mic clips and returns time-synced lyrics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "shazamio>=0.7",
    "av>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=2",
    # shazamio -> pydub imports `audioop`, which Python 3.13 removed from the stdlib
    "audioop-lts>=0.2; python_version >= '3.13'",
    # Word timing (lezepplean.align): a small CTC model on the CPU, the song's audio from
    # YouTube, and romanization for lyrics in other scripts. No PyTorch, no GPU.
    "onnxruntime>=1.20",
    "yt-dlp[default]>=2026.8.19",
    "uroman>=1.3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
